
name: smart_clinic_app
description: "Secure patient record management for Smart Clinic App"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  cloud_functions: ^6.0.0

  # Image Picker
  image_picker: ^1.0.7

  # Image viewer / zoom
  photo_view: ^0.15.0

  # HTTP / ImageBB
  http: ^1.2.2

  # PDF
  pdf: ^3.10.6
  printing: ^5.13.4

  # Permissions
  permission_handler: ^12.0.1

  # File handling
  path_provider: ^2.1.2
  path: ^1.8.3

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2

  # Local database
  sqflite: ^2.3.2

  # External links
  url_launcher: ^6.1.10
  image_gallery_saver: ^2.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # App launcher icon generator
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # App images/assets
  assets:
    - assets/images/

# Smart Clinic App launcher icon
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/smart_clinic_logo.png"

  # Android adaptive icon
  adaptive_icon_background: "#0A1A2F"
  adaptive_icon_foreground: "assets/images/smart_clinic_logo.png"

  # iOS
  remove_alpha_ios: true

