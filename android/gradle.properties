# JVM memory settings for Gradle builds
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Enable AndroidX support
android.useAndroidX=true
android.enableJetifier=true

# Gradle daemon for faster builds
org.gradle.daemon=true

# Enable parallel project execution for faster builds
org.gradle.parallel=true

# Configure build cache to speed up rebuilds
org.gradle.caching=true

# Kotlin options for compatibility with Flutter 3.41
kotlin.incremental=true
kotlin.code.style=official

# Avoid long path issues on Windows
android.enableBuildCache=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
